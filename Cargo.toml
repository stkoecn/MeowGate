[package]
name = "meowgate"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2.0"
toml = "0.8"
sysinfo = "0.39.6"
walkdir = "2.5.0"
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "MeowGate Team <dev@meowgate.local>"
copyright = "2026, MeowGate"
license-file = ["README.md", "0"]
extended-description = """\
MeowGate is a lightweight Rust-based Clash node routing manager and proxy gateway \
that aggregates configurations, assigns credentials, and serves a unified Web UI."""
section = "net"
priority = "optional"
assets = [
    ["target/release/meowgate", "usr/local/bin/meowgate", "755"],
    ["config.toml", "opt/meowgate/config.toml", "644"],
    ["meowgate.service", "lib/systemd/system/meowgate.service", "644"],
]
