<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Cyber Blue to Royal Purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- App Icon Top Gloss -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cat Fur Gradient: Smooth Warm Pearl White to Soft Silver -->
    <linearGradient id="catFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Cat Body Gradient -->
    <linearGradient id="catBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Ear Pink Gradient -->
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Cyber Eyes: Deep Electric Cyan / Teal -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gateway Ring Glow -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Collar & Nexus Jewel Gradient -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowSquircle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>

    <filter id="shadowCat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>

    <filter id="glowJewel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#34d399" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Container (macOS / iOS style) -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" filter="url(#shadowSquircle)" />
  <!-- Inner Border Highlight -->
  <rect x="6.5" y="6.5" width="115" height="115" rx="27.5" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" />

  <!-- 2. Cyber Gateway Portal Ring & Circuit Nodes -->
  <circle cx="64" cy="62" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 5" />
  <circle cx="64" cy="62" r="51" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Network Routing Satellite Nodes -->
  <circle cx="64" cy="16" r="3" fill="#38bdf8" />
  <circle cx="64" cy="16" r="1.5" fill="#ffffff" />
  <circle cx="18" cy="62" r="2.5" fill="#818cf8" />
  <circle cx="110" cy="62" r="2.5" fill="#c084fc" />

  <!-- 3. Cat Character (Complete: Ears, Head, Body, Paws & Collar) -->
  <g filter="url(#shadowCat)">
    <!-- Cat Ears Outer -->
    <path d="M 28,60 L 32,18 L 60,42 Z" fill="url(#catFur)" stroke="#cbd5e1" stroke-width="1" stroke-linejoin="round" />
    <path d="M 100,60 L 96,18 L 68,42 Z" fill="url(#catFur)" stroke="#cbd5e1" stroke-width="1" stroke-linejoin="round" />

    <!-- Cat Ears Inner Pink Accent -->
    <path d="M 34,53 L 37,25 L 55,43 Z" fill="url(#earPink)" />
    <path d="M 94,53 L 91,25 L 73,43 Z" fill="url(#earPink)" />

    <!-- Cat Body & Shoulders (Grounds the character into the bottom) -->
    <path d="M 32,86 C 30,105 28,122 28,122 L 100,122 C 100,122 98,105 96,86 Z" fill="url(#catBody)" />

    <!-- Cat Head (Full Rounded Cheeks, perfectly proportioned) -->
    <path d="M 28,62 
             C 26,44 42,38 64,38 
             C 86,38 102,44 100,62 
             C 102,82 88,94 64,94 
             C 40,94 26,82 28,62 Z" 
          fill="url(#catFur)" />

    <!-- White Chest Bib -->
    <path d="M 52,94 C 52,110 46,122 46,122 L 82,122 C 82,122 76,110 76,94 Z" fill="#ffffff" />

    <!-- Cute Front Paws resting at bottom -->
    <ellipse cx="44" cy="118" rx="9" ry="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <ellipse cx="84" cy="118" rx="9" ry="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  </g>

  <!-- 4. Cyber Cat Eyes (Large, expressive, vibrant) -->
  <!-- Left Eye -->
  <g>
    <ellipse cx="46" cy="62" rx="8" ry="10" fill="#0f172a" />
    <ellipse cx="46" cy="62" rx="6.5" ry="8.5" fill="url(#eyeGrad)" />
    <!-- Pupil Core -->
    <ellipse cx="46" cy="62" rx="4.5" ry="6.5" fill="#0c4a6e" />
    <!-- Specular Highlights -->
    <circle cx="49" cy="58" r="3" fill="#ffffff" />
    <circle cx="43.5" cy="65.5" r="1.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Right Eye -->
  <g>
    <ellipse cx="82" cy="62" rx="8" ry="10" fill="#0f172a" />
    <ellipse cx="82" cy="62" rx="6.5" ry="8.5" fill="url(#eyeGrad)" />
    <!-- Pupil Core -->
    <ellipse cx="82" cy="62" rx="4.5" ry="6.5" fill="#0c4a6e" />
    <!-- Specular Highlights -->
    <circle cx="85" cy="58" r="3" fill="#ffffff" />
    <circle cx="79.5" cy="65.5" r="1.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 5. Cute Nose, Mouth & Whiskers -->
  <!-- Tiny Pink Nose -->
  <polygon points="64,72 60.5,68 67.5,68" fill="#f43f5e" />

  <!-- Smiling Cat Mouth -->
  <path d="M 64,72 Q 60,78 55,75 M 64,72 Q 68,78 73,75" 
        fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" />

  <!-- Natural Whiskers (Originating cleanly from cheek area) -->
  <!-- Left Whiskers -->
  <line x1="38" y1="67" x2="16" y2="65" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="37" y1="73" x2="18" y2="76" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
  <!-- Right Whiskers -->
  <line x1="90" y1="67" x2="112" y2="65" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="91" y1="73" x2="110" y2="76" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

  <!-- 6. Cyber Gateway Collar & Router Nexus Jewel -->
  <!-- Smart Routing Collar -->
  <path d="M 46,92 Q 64,98 82,92 L 80,97 Q 64,103 48,97 Z" fill="#334155" />
  
  <!-- Center Gateway Diamond Bell / Status Jewel -->
  <g filter="url(#glowJewel)">
    <polygon points="64,95 70,101 64,107 58,101" fill="url(#collarGrad)" />
    <!-- Core Bright Dot -->
    <circle cx="64" cy="101" r="2" fill="#ffffff" />
  </g>

  <!-- 7. Glass Gloss Overlay on App Icon (Top curved light reflex) -->
  <path d="M 6,34 C 6,18 18,6 34,6 L 94,6 C 110,6 122,18 122,34 L 122,46 C 80,48 40,36 6,56 Z" fill="url(#topGloss)" />
</svg>